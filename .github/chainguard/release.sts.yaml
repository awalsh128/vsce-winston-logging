# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

# Tokens for publish.yml to push release tags. Octo STS reads this file from the
# default branch (main), and only the publish workflow running on main or staging matches. The
# subject carries the owner and repository IDs, so a repository that later takes this name doesn't
# match either. It accepts the repository's current name and its planned new one, winston-host-adapters,
# so the rename doesn't cut off tokens; drop the old name afterwards. See CONTRIBUTING.md#release-credentials.
issuer: https://token.actions.githubusercontent.com
subject_pattern: "repo:awalsh128@2087466/(vsce-winston-logging|winston-host-adapters)@1457047089:.*"
claim_pattern:
  ref: "refs/heads/(main|staging)"
  job_workflow_ref: "awalsh128/(vsce-winston-logging|winston-host-adapters)/\\.github/workflows/publish\\.yml@refs/heads/(main|staging)"

permissions:
  contents: write
