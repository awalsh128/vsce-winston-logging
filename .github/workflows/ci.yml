name: CI

on:
  # staging: gives the nightly and promote workflows a result for staging's exact commit. main: reports the status of each promotion.
  push:
    branches: [main, staging]
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5, Node 24

      - name: Setup
        uses: ./.github/actions/setup

      # Runtime dependencies ship to npm users, so any advisory fails the build.
      - name: Audit runtime dependencies
        uses: oke-py/npm-audit-action@da53d502b06a0bc95f9ce3c0ebab0c4c713fae4a
        with:
          production_flag: true
          audit_level: low
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_pr_comments: true
          create_issues: true
          issue_title: npm audit found vulnerabilities in runtime dependencies
          issue_labels: vulnerability,test
          dedupe_issues: true

      # Development tools never ship, so moderate advisories are reported in an issue without
      # failing the build.
      - name: Report development dependency advisories
        uses: oke-py/npm-audit-action@da53d502b06a0bc95f9ce3c0ebab0c4c713fae4a
        with:
          audit_level: moderate
          fail_on_vulnerabilities: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_pr_comments: true
          create_issues: true
          issue_labels: vulnerability,test
          dedupe_issues: true

      # Some tools run with publishing credentials, so high and critical advisories still fail.
      - name: Audit all dependencies for high severity
        uses: oke-py/npm-audit-action@da53d502b06a0bc95f9ce3c0ebab0c4c713fae4a
        with:
          audit_level: high
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_pr_comments: false
          create_issues: false

      - name: Check formatting
        run: npm run format:check

      # Packages import each other through their dist/, so everything builds first.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: API docs
        run: npm run docs:api

      # Catches packaging regressions, such as missing dist files, before a release.
      - name: Pack
        run: npm pack --dry-run --workspaces
