# Starts a nightly release candidate when staging has npm package changes since its last release.
#
# Candidates are published to npm under the `rc` dist-tag, so they must run publish.yml on its own:
# npm trusted publishing trusts that workflow file started directly, not through another workflow.
# Schedules only run on the default branch, so this runs on main and starts publish.yml on staging.
# publish.yml still requires CI to have passed on the commit, and semantic-release still releases
# nothing when the commits since the last release call for no version (docs, ci, chore, ...).
name: Nightly release candidate

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # Start the publish workflow
    steps:
      - name: Checkout staging
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false

      # The npm packages are what `npm pack` ships: dist/, built from each package's sources, plus
      # its package.json and dependencies. Anything else (docs, tests, workflows) is not an npm
      # change. Each package is compared with its own last release tag; the shared lockfile and
      # tsconfig.base.json count for every package. publish.yml still releases nothing for a package
      # whose commits call for no version.
      - name: Look for npm changes since each package's last release
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          # package directory:tag pattern (the deprecated name keeps its plain v* tags)
          for entry in \
            "winston-host:winston-host-v*" \
            "winston-vscode:winston-vscode-v*" \
            "winston-github-actions:winston-github-actions-v*" \
            "vsce-winston-logging:v*"; do
            package="${entry%%:*}"
            pattern="${entry#*:}"
            last="$(git describe --tags --abbrev=0 --match "$pattern" HEAD 2>/dev/null || true)"
            if [[ -z "$last" ]]; then
              echo "$package: no release yet, so everything is new."
              changed=true
              continue
            fi
            files="$(git diff --name-only "$last" HEAD -- \
              "packages/$package" ":!packages/$package/test" ":!packages/$package/README.md" \
              package.json package-lock.json tsconfig.base.json)"
            if [[ -z "$files" ]]; then
              echo "$package: no npm changes since $last."
            else
              echo "$package: npm changes since $last:"
              echo "$files"
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Start release candidate
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run publish.yml --ref staging
