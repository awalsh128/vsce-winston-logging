name: Publish

# Releases vsce-winston-logging with semantic-release, always gated by CI:
# - staging: nightly.yml starts this when staging has npm changes, releasing a candidate
#   (e.g. 1.2.0-rc.1) to npm under the `rc` dist-tag, as a tag and as a GitHub prerelease.
# - main: promote.yml starts this after fast-forwarding main to a CI-passed staging commit,
#   releasing an official version (e.g. 1.2.0) and publishing it to npm.
# - Manual and nightly runs first require a successful CI run for the commit.
#
# No secrets: the job's OIDC token is exchanged for each credential.
# - Tags are pushed with an Octo STS token (.github/chainguard/release.sts.yaml).
# - npm trusted publishing is bound to this workflow file and the 'release' environment, which only
#   main and staging can use.
#
# See release.config.cjs and CONTRIBUTING.md#publishing.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the release process without publishing anything or pushing tags"
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    outputs:
      version: ${{ steps.release.outputs.version }} # Empty when nothing was released
    # One release per branch at a time; never cancel one that is tagging.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read # For checking CI results on manual runs
      contents: write # For GitHub releases
      id-token: write # For OIDC: the Octo STS tag token and npm trusted publishing with provenance
      issues: write # For semantic-release comments
      pages: read # For configure-pages to read the Pages site settings
      pull-requests: write # For semantic-release comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 0 # semantic-release reads every commit and tag since the last release
          persist-credentials: false

      - name: Require CI success
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}

      # This job can mint npm publish and GitHub tokens, so dependencies' install scripts don't run.
      # dist/ is built by the prepack script when npm publishes.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: true

      # Also builds the API docs (see release.config.cjs) and sets the `version` output when it
      # releases.
      - name: Release
        id: release
        uses: ./.github/actions/semantic-release
        with:
          working-directory: .
          dry-run: ${{ inputs.dry-run || false }}

      # Only official releases update the docs site. Dry runs and runs that release nothing leave
      # the `version` output empty.
      - name: Setup Pages
        if: ${{ github.ref == 'refs/heads/main' && steps.release.outputs.version != '' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && steps.release.outputs.version != '' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

  # Deploys in its own job so it can use the github-pages environment, which records each deployment
  # and only allows main. The release job can't use it because it also runs on staging.
  deploy-pages:
    needs: release
    if: ${{ github.ref == 'refs/heads/main' && needs.release.outputs.version != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # For GitHub Pages deployment
      id-token: write # For OIDC verification of the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
