name: Publish

# Releases each package of this repository independently, always gated by CI:
# - staging: nightly.yml starts this when staging has npm changes, releasing a candidate
#   (e.g. winston-host-v1.2.0-rc.1) to npm under the `rc` dist-tag, as a tag and as a GitHub prerelease.
# - main: promote.yml starts this after fast-forwarding main to a CI-passed staging commit,
#   releasing an official version (e.g. winston-host-v1.2.0) and publishing it to npm.
# - Manual and nightly runs first require a successful CI run for the commit.
#
# No secrets: the job's OIDC token is exchanged for each credential.
# - Tags are pushed with an Octo STS token (.github/chainguard/release.sts.yaml).
# - npm trusted publishing is bound to this workflow file and the 'release' environment, which only
#   main and staging can use.
#
# Runs awalsh128/npm-publish-strict, which checks the release preconditions and bundles the
# semantic-release config. See CONTRIBUTING.md#publishing.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the release process without publishing anything or pushing tags"
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    outputs:
      released: ${{ steps.released.outputs.any }} # "true" when an official release should update the docs
    # One release per branch at a time; never cancel one that is tagging.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read # For checking CI results on manual runs
      contents: write # For GitHub releases
      id-token: write # For OIDC: the Octo STS tag token and npm trusted publishing with provenance
      issues: write # For semantic-release comments
      pages: read # For configure-pages to read the Pages site settings
      pull-requests: write # For semantic-release comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 0 # semantic-release reads every commit and tag since the last release
          persist-credentials: false

      - name: Require CI success
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}

      # This job can mint npm publish and GitHub tokens, so dependencies' install scripts don't run.
      # dist/ is built by the prepack script when npm publishes.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: true

      # GitHub rejects tag creation by GITHUB_TOKEN under the rulesets, so tags are pushed with an
      # Octo STS token (.github/chainguard/release.sts.yaml).
      - name: Create tag token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: release

      # Packages import each other through their dist/, so all of them build before any is released.
      # npm publish builds the package again through its prepack script.
      - name: Build
        run: npm run build

      # Each package is released on its own: its tag format, the commits that touch it, and its
      # internal dependencies pinned to their latest releases. Order follows the dependencies, so a
      # package never publishes before what it depends on, and a failure stops the rest.
      # Each step checks the release preconditions, then runs semantic-release with the action's
      # config: tag, GitHub Release and npm publish (main and staging). It sets the `version` output
      # when it releases. baseline-commit is the last commit without a Conventional Commit message
      # (the initial import), which predates every release tag, so it never affected versioning; it
      # only keeps the commit-messages check from failing on it.
      #
      # The action is pinned to v1.1.0, the first release with the tag-format, commit-paths and
      # pin-dependencies inputs.
      - name: Release winston-host
        id: host
        uses: awalsh128/npm-publish-strict@cee67e7616c8f6dbf81b9a2bf098cdfbd518a2fa # v1.1.0
        with:
          working-directory: packages/winston-host
          tag-format: winston-host-v${version}
          commit-paths: packages/winston-host
          dry-run: ${{ inputs.dry-run || 'false' }}
          baseline-commit: 90bc54b09d361f1d080b40a91815c6b7381a4d06
          git-credentials: x-access-token:${{ steps.octo-sts.outputs.token }}
          github-token: ${{ github.token }}

      - name: Release winston-vscode
        id: vscode
        uses: awalsh128/npm-publish-strict@cee67e7616c8f6dbf81b9a2bf098cdfbd518a2fa # v1.1.0
        with:
          working-directory: packages/winston-vscode
          tag-format: winston-vscode-v${version}
          commit-paths: packages/winston-vscode
          pin-dependencies: "@awalsh128/winston-host=winston-host-v${version}"
          dry-run: ${{ inputs.dry-run || 'false' }}
          baseline-commit: 90bc54b09d361f1d080b40a91815c6b7381a4d06
          git-credentials: x-access-token:${{ steps.octo-sts.outputs.token }}
          github-token: ${{ github.token }}

      - name: Release winston-github-actions
        id: actions
        uses: awalsh128/npm-publish-strict@cee67e7616c8f6dbf81b9a2bf098cdfbd518a2fa # v1.1.0
        with:
          working-directory: packages/winston-github-actions
          tag-format: winston-github-actions-v${version}
          commit-paths: packages/winston-github-actions
          pin-dependencies: "@awalsh128/winston-host=winston-host-v${version}"
          dry-run: ${{ inputs.dry-run || 'false' }}
          baseline-commit: 90bc54b09d361f1d080b40a91815c6b7381a4d06
          git-credentials: x-access-token:${{ steps.octo-sts.outputs.token }}
          github-token: ${{ github.token }}

      # The deprecated name keeps its v* tags, so it continues from 1.1.0.
      - name: Release vsce-winston-logging
        id: shim
        uses: awalsh128/npm-publish-strict@cee67e7616c8f6dbf81b9a2bf098cdfbd518a2fa # v1.1.0
        with:
          working-directory: packages/vsce-winston-logging
          commit-paths: packages/vsce-winston-logging
          pin-dependencies: "@awalsh128/winston-vscode=winston-vscode-v${version}"
          dry-run: ${{ inputs.dry-run || 'false' }}
          baseline-commit: 90bc54b09d361f1d080b40a91815c6b7381a4d06
          git-credentials: x-access-token:${{ steps.octo-sts.outputs.token }}
          github-token: ${{ github.token }}

      # Only official releases update the docs site, which covers every package, so it is rebuilt
      # whole instead of from the package that released. Dry runs and runs that release nothing
      # leave every `version` output empty.
      - name: Check for official releases
        id: released
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          VERSIONS: ${{ steps.host.outputs.version }}${{ steps.vscode.outputs.version }}${{ steps.actions.outputs.version }}${{ steps.shim.outputs.version }}
        run: echo "any=$([[ -n "$VERSIONS" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build API docs
        if: ${{ steps.released.outputs.any == 'true' }}
        run: npm run docs:api

      - name: Setup Pages
        if: ${{ steps.released.outputs.any == 'true' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: ${{ steps.released.outputs.any == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

  # Deploys in its own job so it can use the github-pages environment, which records each deployment
  # and only allows main. The release job can't use it because it also runs on staging.
  deploy-pages:
    needs: release
    if: ${{ github.ref == 'refs/heads/main' && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # For GitHub Pages deployment
      id-token: write # For OIDC verification of the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
